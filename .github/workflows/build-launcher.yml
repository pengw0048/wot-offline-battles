name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    branches:
      - fix/0922-cliff-gravity-hull-damage
      - fix/0922-battle-followup-20260914
      - fix/0922-bonds-crew-grand-battles
      - fix/0922-native-offers-training-reserves-20260917
      - fix/094-pr40-gameplay-20260925
      - release/v0.9.5

permissions:
  contents: read

jobs:
  windows-server:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          architecture: "x64"
      - name: Install pinned Windows server packager
        run: >-
          python -m pip install
          -r server/requirements-windows-build.txt
      - name: Build Windows LAN server for the manual client overlay
        shell: pwsh
        run: >-
          pwsh -NoProfile -File
          server/build_windows_server.ps1
      - name: Verify v0.9.5 server executable version
        if: github.ref == 'refs/heads/release/v0.9.5'
        shell: pwsh
        run: |
          $version = (Get-Item -LiteralPath 'dist/server/WoT-0.9.22-LAN-Server.exe').VersionInfo
          if ($version.FileVersion -ne '0.9.5' -or
              $version.ProductVersion -ne '0.9.5') {
            throw 'Incorrect Windows server executable version'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-manual-server-input
          path: dist/server/WoT-0.9.22-LAN-Server.exe
          if-no-files-found: error
          retention-days: 1

  client-payload:
    needs: windows-server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test launcher and payload staging
        working-directory: launcher
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - uses: actions/download-artifact@v4
        with:
          name: launcher-manual-server-input
          path: dist/server
      - name: Reproduce the verified recorder resource
        run: python tools/build_replay_runtime.py
      - name: Build Python 2.7 0.9.22 client package
        run: >-
          docker run --rm --platform linux/amd64 -v "$PWD:/work"
          -e WOT_OFFLINE_BUILD_IDENTITY="colorfulmeans-${{ github.run_id }}-${{ github.run_attempt }}"
          -w /work python:2.7.18
          python build_wotmod.py
      - name: Validate 0.9.22 client package
        run: >-
          python tools/validate_wotmod.py
          dist/org.colorfulmeans.offline_lan_0922_*.wotmod
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-build-input
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  windows-launcher:
    runs-on: windows-latest
    needs: client-payload
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"
          architecture: "x64"
      - name: Install pinned Windows packager
        run: >-
          python -m pip install
          -r launcher/requirements-build.txt
      - uses: actions/download-artifact@v4
        with:
          name: launcher-build-input
          path: dist
      - name: Test launcher on Windows
        working-directory: launcher
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build launcher distribution
        shell: pwsh
        run: pwsh -NoProfile -File launcher/build_launcher.ps1
      - name: Verify v0.9.5 launcher and client versions
        if: github.ref == 'refs/heads/release/v0.9.5'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = "launcher/dist/wot-0.9.22-offline-battles"
          $archive = "$app/_internal/client/0.9.22.zip"
          $version = (Get-Item -LiteralPath "$app/wot-0.9.22-offline-battles.exe").VersionInfo
          if ($version.FileVersion -ne '0.9.5' -or
              $version.ProductVersion -ne '0.9.5') {
            throw 'Incorrect Windows launcher executable version'
          }
          @'
          import io, json, sys, zipfile
          from xml.etree import ElementTree
          with zipfile.ZipFile(sys.argv[1]) as client:
              identity = json.loads(client.read(
                  'mods/configs/offline_lan_0922/build_identity.json'))
              assert identity['semanticVersion'] == '0.9.5', identity
              mods = [name for name in client.namelist() if name.endswith('.wotmod')]
              assert len(mods) == 1 and mods[0].endswith('_0.9.5.wotmod'), mods
              with zipfile.ZipFile(io.BytesIO(client.read(mods[0]))) as mod:
                  assert mod.testzip() is None
                  assert ElementTree.fromstring(mod.read('meta.xml')).findtext('version') == '0.9.5'
          print('Verified v0.9.5 client build identity and mod.')
          '@ | python - $archive
          if ($LASTEXITCODE -ne 0) { throw "Client release version check failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: wot-0.9.22-offline-battles-windows-${{ github.run_number }}
          # Upload the runnable folder; Actions supplies the only outer ZIP.
          path: launcher/dist/wot-0.9.22-offline-battles/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Extract the actual download once
        uses: actions/download-artifact@v4
        with:
          name: wot-0.9.22-offline-battles-windows-${{ github.run_number }}
          path: ${{ runner.temp }}/launcher-download
      - name: Verify payload, fake-client install, and bundled servers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appName = "wot-0.9.22-offline-battles"
          $appRoot = Join-Path $env:RUNNER_TEMP "launcher-download"
          $launcher = Join-Path $appRoot "$appName.exe"
          $payload = Join-Path $appRoot "_internal"
          if (-not (Test-Path -LiteralPath $launcher) -or
                  (Get-ChildItem -LiteralPath $appRoot -Filter *.zip)) {
              throw "Launcher download must run after one ZIP extraction"
          }
          Write-Host "Downloaded launcher is runnable after one ZIP extraction"
          $fakeRoot = Join-Path $env:RUNNER_TEMP "WoT 假客户端"
          $fake082 = Join-Path $fakeRoot "0.8.2"
          $fake0922 = Join-Path $fakeRoot "0.9.22 #1513"
          New-Item -ItemType Directory -Force -Path $fake082,$fake0922 | Out-Null
          Set-Content -LiteralPath (Join-Path $fake082 "WorldOfTanks.exe") -Value ""
          Set-Content -LiteralPath (Join-Path $fake082 "version.xml") `
              -Value "<version> v.0.8.2 #335 </version>"
          Set-Content -LiteralPath (Join-Path $fake0922 "WorldOfTanks.exe") -Value ""
          Set-Content -LiteralPath (Join-Path $fake0922 "version.xml") `
              -Value "<version> v.0.9.22.0.1 #1513 </version>"

          @'
          import json
          import os
          import sys
          import zipfile

          sys.path.insert(0, os.path.join(os.getcwd(), 'launcher'))
          import core

          payload, fake082, fake0922 = sys.argv[1:4]
          for port in core.SUPPORTED_PORTS:
              archive_path = os.path.join(payload, 'client', port + '.zip')
              with zipfile.ZipFile(archive_path) as archive:
                  names = archive.namelist()
              assert not any('__pycache__' in name or name.endswith('.sha256')
                             for name in names), port
          assert core.inspect_game_root(fake082)['client'] is None
          cases = ((core.PORT_0_9_22, fake0922),)
          for port, game_root in cases:
              status = core.inspect_game_root(game_root)
              assert status['client'] == port, status
              core.install_client_mod(game_root, port, base_dir=payload)
              assert core._installation_complete(
                  game_root, port, core._CLIENT_INSTALL[port])

          data_root_0922 = os.path.join(
              fake0922, 'mods', 'configs', 'offline_lan_0922')
          inventories = [(os.path.join(data_root_0922, name), 41)
              for name in
              ('navgraphs', 'foliage', 'destructibles')]
          for data_root, expected_count in inventories:
              manifest_path = os.path.join(data_root, 'manifest.json')
              with open(manifest_path, 'rb') as stream:
                  manifest = json.load(stream)
              records = manifest.get('maps')
              assert (isinstance(records, list) and
                      len(records) == expected_count), data_root
              for record in records:
                  assert os.path.isfile(os.path.join(
                      data_root, record['file'])), (data_root, record)
          '@ | python - $payload $fake082 $fake0922
          if ($LASTEXITCODE -ne 0) {
              throw "Bundled client installation verification failed"
          }

          $ProtocolProbe = @'
          import os
          import sys
          sys.path.insert(0, os.path.join(os.getcwd(), 'launcher'))
          import core
          raise SystemExit(0 if core.probe_server_protocol(
              sys.argv[1], '127.0.0.1', 28782, timeout=1.0) else 1)
          '@
          foreach ($port in @("0.9.22")) {
              $process = Start-Process -FilePath $launcher `
                  -ArgumentList "--serve", $port -PassThru
              try {
                  $deadline = (Get-Date).AddSeconds(60)
                  $compatible = $false
                  while ((Get-Date) -lt $deadline) {
                      if ($process.HasExited) {
                          throw "$port server exited before its protocol answered"
                      }
                      $ProtocolProbe | python - $port
                      if ($LASTEXITCODE -eq 0) {
                          $compatible = $true
                          break
                      }
                      Start-Sleep -Milliseconds 250
                  }
                  if (-not $compatible) {
                      throw "$port server did not answer its bundled protocol"
                  }
              }
              finally {
                  if (-not $process.HasExited) {
                      & taskkill.exe /PID $process.Id /T /F | Out-Null
                      $global:LASTEXITCODE = 0
                  }
                  Start-Sleep -Seconds 2
              }
          }
