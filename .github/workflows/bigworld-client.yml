name: Build standalone BigWorld client

on:
  workflow_dispatch:
    inputs:
      client_build_run:
        description: 'Reuse an existing client artifact for startup debugging'
        required: false
        type: string
  push:
    paths:
      - 'tools/build_bigworld_client.ps1'
      - 'native/standalone_client/bigworld/**'

permissions:
  contents: read
  actions: read

jobs:
  client:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned BigWorld engine with MSVC
        if: ${{ !inputs.client_build_run }}
        shell: pwsh
        run: >-
          ./tools/build_bigworld_client.ps1
          -WorkDirectory "$env:RUNNER_TEMP\bigworld-client"
      - name: Reuse the selected native client build
        if: ${{ inputs.client_build_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_BUILD_RUN: ${{ inputs.client_build_run }}
        run: |
          $root = "$env:RUNNER_TEMP\bigworld-client\artifacts"
          New-Item -ItemType Directory -Path "$root\client", "$root\logs" | Out-Null
          gh run download $env:CLIENT_BUILD_RUN --repo $env:GITHUB_REPOSITORY `
            -n bigworld-client-win32 -D "$root\client"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to retrieve the selected build' }
      - name: Capture first startup diagnostics
        continue-on-error: true
        shell: pwsh
        run: |
          $client = "$env:RUNNER_TEMP\bigworld-client\artifacts\client"
          $logs = "$env:RUNNER_TEMP\bigworld-client\artifacts\logs"
          $debugger = "$env:RUNNER_TEMP\procdump"
          Invoke-WebRequest 'https://download.sysinternals.com/files/Procdump.zip' `
            -OutFile "$debugger.zip"
          Expand-Archive "$debugger.zip" $debugger
          $monitor = Start-Process -FilePath "$debugger\procdump.exe" `
            -ArgumentList @('-accepteula', '-ma', '-e', '-x', $logs, `
              "$client\bwclient_h.exe", '-noConversion', '-unattended') `
            -WorkingDirectory $client -PassThru `
            -RedirectStandardOutput "$logs\startup-stdout.log" `
            -RedirectStandardError "$logs\startup-stderr.log"
          $process = $null
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            $started = $false
            $rendered = $false
            do {
              $exited = $monitor.WaitForExit(1000)
              if (-not $process) {
                $child = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($monitor.Id)" |
                  Where-Object Name -eq 'bwclient_h.exe' | Select-Object -First 1
                if ($child) { $process = Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue }
              }
              if (Test-Path "$client\standalone.log") {
                $started = [bool](Select-String -Path "$client\standalone.log" `
                  -SimpleMatch 'StandaloneApp: native application started' -Quiet)
                $rendered = [bool](Select-String -Path "$client\standalone.log" `
                  -SimpleMatch 'StandaloneApp: first native frame rendered' -Quiet)
              }
            } while (-not $exited -and -not $rendered -and [DateTime]::UtcNow -lt $deadline)
            if ($process) { $process.Refresh() }
            @{
              exited = $exited
              native_application_started = $started
              first_native_frame_rendered = $rendered
              exit_code = $(if ($process -and $process.HasExited) { $process.ExitCode } else { $null })
              window_title = $(if ($process) { $process.MainWindowTitle } else { '' })
              window_handle = $(if ($process) { $process.MainWindowHandle.ToInt64() } else { 0 })
              scope = "First startup on a hosted runner; no map or gameplay acceptance"
            } | ConvertTo-Json | Set-Content "$logs\startup.json"
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bitmap = New-Object System.Drawing.Bitmap($screen.Width, $screen.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $bitmap.Size)
              $bitmap.Save("$logs\startup.png")
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            if (-not $monitor.WaitForExit(10000)) { Stop-Process -Id $monitor.Id -Force }
            Get-ChildItem $client -Filter *.log | Copy-Item -Destination $logs
            Get-ChildItem $client -Filter *.dmp | Copy-Item -Destination $logs
          }
          $cdb = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x86\cdb.exe"
          if (Test-Path $cdb) {
            Get-ChildItem $logs -Filter *.dmp | ForEach-Object {
              & $cdb -z $_.FullName -i $client -y $client -c '.ecxr;kv;lm;qd' 2>&1 |
                Out-File "$logs\native-stack.txt" -Append
            }
          }
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigworld-client-build-diagnostics
          path: |
            ${{ runner.temp }}/bigworld-client/artifacts/logs/
            ${{ runner.temp }}/bigworld-client/artifacts/build-inputs.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload standalone engine binary
        if: ${{ !inputs.client_build_run }}
        uses: actions/upload-artifact@v4
        with:
          name: bigworld-client-win32
          path: ${{ runner.temp }}/bigworld-client/artifacts/client/
          if-no-files-found: error
          retention-days: 7
