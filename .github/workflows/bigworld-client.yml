name: Build standalone BigWorld client

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_bigworld_client.ps1'
      - 'native/standalone_client/bigworld/**'
      - '.github/workflows/bigworld-client.yml'

permissions:
  contents: read

jobs:
  client:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned BigWorld engine with MSVC
        shell: pwsh
        run: >-
          ./tools/build_bigworld_client.ps1
          -WorkDirectory "$env:RUNNER_TEMP\bigworld-client"
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigworld-client-build-diagnostics
          path: |
            ${{ runner.temp }}/bigworld-client/artifacts/logs/
            ${{ runner.temp }}/bigworld-client/artifacts/build-inputs.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload standalone engine binary
        uses: actions/upload-artifact@v4
        with:
          name: bigworld-client-win32
          path: ${{ runner.temp }}/bigworld-client/artifacts/client/
          if-no-files-found: error
          retention-days: 7
