name: Build standalone BigWorld client

on:
  workflow_dispatch:
    inputs:
      client_build_run:
        description: 'Reuse an existing client artifact for startup debugging'
        required: false
        type: string
  push:
    paths:
      - 'tools/build_bigworld_client.ps1'
      - 'tools/configure_bigworld_build_cache.py'
      - 'tools/build_scaleform_sdk.ps1'
      - 'native/standalone_client/bigworld/**'
      - 'native/standalone_client/tests/run_stock_replay_file_probe.py'

permissions:
  contents: read
  actions: read

jobs:
  client:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Set up the native compilation cache
        if: ${{ !inputs.client_build_run }}
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: v0.15.0
          disable_annotations: true
      - name: Build pinned BigWorld engine with MSVC
        if: ${{ !inputs.client_build_run }}
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: 'true'
          SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
          WOT_WWISE_SDK_URL: ${{ secrets.WOT_WWISE_SDK_URL }}
          WOT_WWISE_SDK_TOKEN: ${{ secrets.WOT_WWISE_SDK_TOKEN }}
        run: >-
          ./tools/build_bigworld_client.ps1
          -WorkDirectory "$env:RUNNER_TEMP\bigworld-client"
      - name: Reuse the selected native client build
        if: ${{ inputs.client_build_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_BUILD_RUN: ${{ inputs.client_build_run }}
        run: |
          $root = "$env:RUNNER_TEMP\bigworld-client\artifacts"
          New-Item -ItemType Directory -Path "$root\client", "$root\logs" | Out-Null
          gh run download $env:CLIENT_BUILD_RUN --repo $env:GITHUB_REPOSITORY `
            -n bigworld-client-win32 -D "$root\client"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to retrieve the selected build' }
          # Reuse compiled code while testing the current application's resources.
          Copy-Item 'native\standalone_client\bigworld\res\*' `
            -Destination "$root\client\res" -Recurse -Force
          $env:STANDALONE_CLIENT_ROOT = "$root\client"
          @'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'native/standalone_client/bigworld')
          from fetch_resources import write_overlay_resources
          root = Path(os.environ['STANDALONE_CLIENT_ROOT'])
          write_overlay_resources(root / 'engine-res/resources.xml', root / 'res/resources.xml')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Unable to merge application resource mappings' }
      - name: Bundle local resource preparation
        shell: pwsh
        run: |
          $client = "$env:RUNNER_TEMP\bigworld-client\artifacts\client"
          python tools/package_native_client.py --client-output $client
          if ($LASTEXITCODE -ne 0) { throw 'Unable to package resource preparation' }
          & "$client\prepare-runtime\python.exe" -B "$client\tools\prepare_native_client.py" --help
          if ($LASTEXITCODE -ne 0) { throw 'Bundled resource preparation cannot start' }
          & "$client\prepare-runtime\python.exe" -B -c "import prepare_native_client, prepare_native_static_models, bake_destructibles_0922; from bake_navigation_0922 import _legacy_baker; _legacy_baker()"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled resource readers cannot load' }
      # The original resource installation is intentionally absent on this
      # public runner. Startup/gameplay acceptance runs with locally owned data.
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bigworld-client-build-diagnostics
          path: |
            ${{ runner.temp }}/bigworld-client/artifacts/logs/
            ${{ runner.temp }}/bigworld-client/artifacts/build-inputs.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload standalone engine binary
        uses: actions/upload-artifact@v4
        with:
          name: bigworld-client-win32
          path: ${{ runner.temp }}/bigworld-client/artifacts/client/
          if-no-files-found: error
          retention-days: 7
